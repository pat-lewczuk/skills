[project]
name = "ratchet"
version = "2.4.1"
requires-python = ">=3.12"
dependencies = ["stripe>=11.1", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["integration: hits the Stripe sandbox"]
addopts = "-m 'not integration'"
