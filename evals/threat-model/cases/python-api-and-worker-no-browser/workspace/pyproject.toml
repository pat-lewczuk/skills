[project]
name = "docproc"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "httpx>=0.28",
  "pypdf>=5.1",
  "anthropic>=0.40",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
